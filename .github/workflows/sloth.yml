name: Sloth

on:
  pull_request:
  merge_group:

permissions:
  actions: read # Lets Sloth ignore check runs cancelled by a newer run.
  checks: read
  contents: read

jobs:
  sloth:
    runs-on: ubuntu-24.04
    steps:
      - name: Sloth
        uses: lendable/sloth@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignored: |
            Validate PR title
