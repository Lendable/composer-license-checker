name: "CI"

concurrency:
  group: "ci-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

on:
  merge_group:
  pull_request:

jobs:
  lint-actionlint:
    name: "Lint workflows"
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: "Install actionlint"
        id: actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12

      - name: "Run actionlint"
        env:
          ACTIONLINT: "${{ steps.actionlint.outputs.executable }}"
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          trap 'echo "::remove-matcher owner=actionlint::"' EXIT
          "$ACTIONLINT" -color

  lint-zizmor:
    name: "Audit workflows"
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: "Install zizmor"
        env:
          ZIZMOR_SHA256: "dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839"
          ZIZMOR_VERSION: "1.29.0"
        run: |
          archive="$RUNNER_TEMP/zizmor.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" -o "$archive"
          echo "${ZIZMOR_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"

      - name: "Run zizmor"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: '"$RUNNER_TEMP/zizmor" --format github .'

  ci:
    name: "Execute (PHP ${{ matrix.php-version }} with ${{ matrix.dependencies }} deps, composer v${{ matrix.composer-version}}.x, symfony v${{ matrix.symfony-version }})"
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read

    strategy:
      matrix:
        dependencies:
          - "lowest"
          - "locked"
          - "highest"
        php-version:
          - "8.4"
          - "8.5"
        composer-version:
          - "2.9"
          - "2.10"
        symfony-version:
          - "5.4.*"
          - "6.4.*"
          - "7.4.*"
          - "8.0.*"
          - "8.1.*"

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # v2
        with:
          coverage: "pcov"
          php-version: "${{ matrix.php-version }}"
          ini-values: memory_limit=-1
          tools: "composer:${{ matrix.composer-version }}"

      - name: Setup Symfony Flex
        if: ${{ matrix.dependencies != 'locked' }}
        shell: bash
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: "${{ matrix.dependencies }}"
        env:
          SYMFONY_REQUIRE: "${{ matrix.symfony-version }}"

      - name: Remove Symfony Flex
        if: ${{ matrix.dependencies != 'locked' }}
        shell: bash
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex false
          composer global remove symfony/flex

      - name: "Validate Composer dependencies"
        run: "composer validate"

      - name: "Check composer.json normalization"
        run: "composer normalize --dry-run"

      - name: "Run security check"
        if: ${{ matrix.composer-version != '2.2' }}
        run: "composer security:check"

      - name: "Check licenses (composer installed.json provider)"
        run: "composer license:check -- --provider-id=json -v"

      - name: "Check licenses (composer licenses provider)"
        run: "composer license:check -- --provider-id=licenses -v"

      - name: "Run coding style"
        if: ${{ matrix.dependencies == 'locked' && matrix.php-version == '8.4' }}
        run: "composer code-style:check"

      - name: "Run PHPStan"
        if: ${{ matrix.dependencies == 'locked' }}
        run: "composer phpstan"

      - name: "Run Rector"
        if: ${{ matrix.dependencies == 'locked' && matrix.php-version == '8.4' }}
        run: "composer rector:check"

      - name: "Unit tests"
        run: "composer tests:unit"

      - name: "End-to-End tests"
        run: "composer tests:e2e"
